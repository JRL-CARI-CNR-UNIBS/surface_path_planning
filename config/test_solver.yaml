surface_path_planning:
    test_solver:
        group_name: "ur_robot"
        start_configuration: [1.570796327,-2.443460953,2.443460953,-1.570796327,1.570796327,0.0] # home position for the sharework ur10e
        goal_configuration_1:  [0.785398,-1.5708,2.35619,-2.26893,1.5708,-0.785398]
        utopia_tolerance: 0.05 # tolerance wrt best solution
        extend: true # if true steps towards next point are truncated at max_distance length
        max_distance: 0.1 # to be used with extend: true
        use_kdtree: true 
        checker_resolution: 0.01
        parallel_checker_n_threads: 4
        goal_bias: 0.1 # defines the probability of sampling the goal configuration

        libraries: ["libgraph_core.so","libmoveit_collision_checker.so"]

        # planner: RRT, BiRRT, RRT*, ANYTIMERRT
        planner_plugin: graph::core::RRTPlugin
        sampler_plugin: graph::core::InformedSamplerPlugin
        metrics_plugin: graph::core::EuclideanMetricsPlugin
        checker_plugin: graph::collision_check::ParallelMoveitCollisionCheckerPlugin

